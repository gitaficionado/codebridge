spring.application.name=codebridge

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/codebridge_db
spring.datasource.username=codebridge_user
spring.datasource.password=${DB_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger UI CSRF support
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
