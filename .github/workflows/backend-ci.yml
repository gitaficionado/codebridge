
name: CodeBridge Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codebridge_db
          POSTGRES_USER: codebridge_user
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codebridge_user -d codebridge_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: ci_test_password_only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        run: mvn --batch-mode test
